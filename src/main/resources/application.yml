spring:
  application:
    name: auth-service

  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${AUTH_DB_USER:auth_user}
    password: ${AUTH_DB_PASSWORD:auth_pass}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth
    open-in-view: false

  flyway:
    schemas: auth
    default-schema: auth
    baseline-on-migrate: true

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:change-me-change-me-change-me-change-me}
    access-ttl-seconds: ${AUTH_JWT_ACCESS_TTL:900}
    refresh-ttl-seconds: ${AUTH_JWT_REFRESH_TTL:604800}
    issuer: trackit-auth

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

server:
  port: 8081
